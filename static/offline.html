<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>Offline - Subject Coach</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eaeaea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .offline-container {
            max-width: 400px;
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: #4a90e2;
        }

        p {
            color: #b8b8b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .cached-content {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .cached-content h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #888;
        }

        .cached-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .cached-links a {
            color: #4a90e2;
            text-decoration: none;
            padding: 0.75rem 1rem;
            background: rgba(74, 144, 226, 0.1);
            border-radius: 8px;
            transition: background 0.2s;
        }

        .cached-links a:hover {
            background: rgba(74, 144, 226, 0.2);
        }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 2rem;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .retry-btn:hover {
            background: #357abd;
        }

        .status {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.online {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>

        <h1>You're Offline</h1>

        <p>
            Don't worry! Your progress is saved locally and will sync automatically
            when you're back online.
        </p>

        <div class="cached-content">
            <h2>Available Offline</h2>
            <div class="cached-links">
                <a href="/">📊 Dashboard</a>
                <a href="/progress">📈 Your Progress</a>
                <a href="/quiz/cached">📝 Cached Quizzes</a>
            </div>
        </div>

        <button class="retry-btn" onclick="window.location.reload()">
            🔄 Try Again
        </button>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Checking connection...</span>
        </div>
    </div>

    <script>
        function updateStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (navigator.onLine) {
                dot.classList.add('online');
                text.textContent = 'Connection restored!';
                // Redirect to home after short delay
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                dot.classList.remove('online');
                text.textContent = 'Still offline';
            }
        }

        // Check status on load
        updateStatus();

        // Listen for connection changes
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        // Periodic check
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
